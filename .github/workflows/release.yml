# Выпуск новой версии: поднять <Version> в Directory.Build.props, закоммитить,
# затем  git tag v0.2.0 && git push origin v0.2.0
# Workflow соберёт gLauncher.exe и опубликует релиз — лаунчеры пользователей увидят обновление.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish src/GLauncher/GLauncher.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:Version=$version -o publish

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG publish/gLauncher.exe --title $env:TAG --generate-notes
